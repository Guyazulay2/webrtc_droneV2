---
name: CI/CD

"on":
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "ui/**"
      - "helm/**"
      - "Dockerfile"
  pull_request:
    branches: [master, main]
    paths:
      - "backend/**"
      - "ui/**"
      - "helm/**"
      - "Dockerfile"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: deepstream-webrtc-klv
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Lint YAML
        run: |
          pip install yamllint
          yamllint .

      - name: Lint Shell Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: error

  build:
    name: Build, Test, Push
    runs-on: ubuntu-latest
    needs: lint

    outputs:
      image: ${{ steps.push.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image into the local Docker daemon (no push yet)
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: deepstream-webrtc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      # Run the test suite inside the built container
      - name: Run tests
        run: |
          docker run --rm deepstream-webrtc:ci \
            sh -c "pip3 install --quiet pytest && python3 -m pytest test_klv_parser.py -v --tb=short"

      # Push to ECR only on master, after tests pass
      - name: Authenticate to AWS
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        id: push
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker tag deepstream-webrtc:ci "${ECR}:${{ env.IMAGE_TAG }}"
          docker tag deepstream-webrtc:ci "${ECR}:latest"
          docker push "${ECR}:${{ env.IMAGE_TAG }}"
          docker push "${ECR}:latest"
          echo "image=${ECR}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  update-image-tag:
    name: Update Image Tag
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://webrtc.your-domain.com

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in Helm values
        run: |
          ECR_REGISTRY="${{ needs.build.outputs.registry }}"
          yq -i ".image.repository = \"${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}\"" \
            helm/deepstream-webrtc/values-production.yaml
          yq -i ".image.tag = \"${{ env.IMAGE_TAG }}\"" \
            helm/deepstream-webrtc/values-production.yaml

      - name: Commit and push image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/deepstream-webrtc/values-production.yaml
          git commit -m "chore(release): update image to ${{ env.IMAGE_TAG }} [skip ci]"
          git push

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [update-image-tag]
    if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Notify success
        if: needs.update-image-tag.result == 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "deepstream-webrtc deployed",
              "attachments": [{
                "color": "#36a64f",
                "fields": [
                  {"title": "Tag", "value": "${{ env.IMAGE_TAG }}", "short": true},
                  {"title": "Author", "value": "${{ github.actor }}", "short": true},
                  {
                    "title": "Run",
                    "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>",
                    "short": true
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: needs.update-image-tag.result != 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "deepstream-webrtc CI FAILED",
              "attachments": [{
                "color": "#ff0000",
                "fields": [
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {
                    "title": "Run",
                    "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>",
                    "short": true
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
