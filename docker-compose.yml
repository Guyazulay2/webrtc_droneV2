version: '3.8'

services:
  deepstream-webrtc:
    build: .
    image: deepstream-webrtc-klv:latest
    container_name: deepstream-webrtc
    environment:
      - GST_DEBUG=2
      - USE_GPU=0
      - LIBNICE_NOUPNP=1
    # network_mode: host = container uses the host's network directly.
    # Required for WebRTC ICE: browser sends mDNS .local candidates,
    # GStreamer needs the host's mDNS resolver to decode them.
    network_mode: host
    volumes:
      - ./backend:/app/backend
      - ./ui:/app/ui
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    restart: unless-stopped
