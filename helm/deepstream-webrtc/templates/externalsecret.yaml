# ─── ExternalSecret ───────────────────────────────────────────────────────────
# External Secrets Operator מסנכרן secrets מ-AWS Secrets Manager ל-K8s Secret
# הpod לא יודע מאיפה ה-secrets מגיעים — הוא רק קורא env vars רגילים
# לראיון: זה הפתרון המועדף. ללא זה — צריך לאחסן secrets ב-K8s ישירות (פחות מאובטח)
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: deepstream-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: deepstream-secrets
    creationPolicy: Owner
  # מושך את ה-secret בשם deepstream-webrtc/production מ-AWS Secrets Manager
  dataFrom:
    - extract:
        key: deepstream-webrtc/production
