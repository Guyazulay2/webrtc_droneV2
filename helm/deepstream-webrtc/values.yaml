image:
  repository: ""
  tag: latest
  pullPolicy: Always

replicaCount: 2

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 1000m

service:
  http:
    port: 8080
  udp:
    rtpPort: 5004
    klvPort: 5005
    rtspPort: 8554

ingress:
  enabled: true
  host: ""
  certificateArn: ""

hpa:
  minReplicas: 2
  maxReplicas: 10
  cpuTarget: 70

env:
  GST_DEBUG: "2"
  USE_GPU: "0"
  LIBNICE_NOUPNP: "1"
  STUN_SERVER: "stun://stun.l.google.com:19302"

redis:
  enabled: false
  # ClusterIP service name follows Helm release name, e.g. deepstream-webrtc-redis
  url: ""
